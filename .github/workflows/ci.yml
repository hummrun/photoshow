name: ci

on:
  push:
    branches: ["main", "refactor/**", "fix/**", "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libxcursor-dev libxi-dev libxrandr-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --all-features --locked

      - name: Release build
        run: cargo build --release --locked

  msrv:
    name: MSRV 1.95
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libxcursor-dev libxi-dev libxrandr-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo check --all-targets --all-features --locked


  prumo-conformance:
    name: Prumo 0.6 conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Fetch current Prumo
        run: git clone --depth 1 https://github.com/poppy-team/prumo.git "$RUNNER_TEMP/prumo"

      - name: Validate project
        run: |
          cd "$RUNNER_TEMP/prumo"
          go run ./cmd/prumo validate "$GITHUB_WORKSPACE"
          go run ./cmd/prumo --json doctor "$GITHUB_WORKSPACE"

      - name: Verify UI contract
        run: |
          cd "$RUNNER_TEMP/prumo"
          go run ./cmd/prumo ui verify --path "$GITHUB_WORKSPACE"
